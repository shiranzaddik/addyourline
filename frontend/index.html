<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1e3a8a" />
    <script>
      // Dark by default; a saved "light" choice opts out. Applied before paint.
      try {
        if (localStorage.getItem("ayl:theme") !== "light") {
          document.documentElement.dataset.theme = "dark";
        }
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <title>Add Your Line — Write a story together</title>
    <meta name="description" content="Write a short story together, two sentences at a time. Play with a friend or a random writer, in English or Hebrew." />
    <meta property="og:title" content="Add Your Line — Write a story together" />
    <meta property="og:description" content="Write a short story together, two sentences at a time." />
    <meta property="og:image" content="/logo.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:image" content="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Caveat:wght@500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Gveret+Levin&display=swap"
      rel="stylesheet"
    />
  </head>

  </body>
</html>
